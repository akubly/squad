# Squad fold pipeline — GitHub variant
# Folds Squad inbox branches into per-callsign Squad state branches.
#
# Trigger: push to any branch under squad/inbox/** (serialized by the single-writer invariant).
# This pipeline is the sole writer to squad/state/<callsign>. No other automation or manual push should target these branches.

on:
  push:
    branches:
      - 'squad/inbox/**'
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write
  actions: read

jobs:
  fold:
    runs-on: ubuntu-latest
    steps:
      # This pipeline is the sole writer to squad/state/<callsign>. No other automation or manual push should target these branches.

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.email "squad-fold@noreply"
          git config user.name "Squad Fold Pipeline"

      - name: Discover and fold callsigns
        id: fold
        run: |
          callsigns="$(git ls-remote --heads origin 'refs/heads/squad/inbox/*' \
            | sed -nE 's#^[0-9a-f]+\srefs/heads/squad/inbox/([^/]+)/.*#\1#p' \
            | sort -u)"

          if [ -z "$callsigns" ]; then
            echo "No Squad inbox callsigns discovered — nothing to do."
            exit 0
          fi

          for CALLSIGN in $callsigns; do
            if ! [[ "$CALLSIGN" =~ ^[a-z][a-z0-9-]{1,38}$ ]]; then
              echo "WARNING: Skipping invalid callsign '$CALLSIGN'."
              continue
            fi

            STATE_BRANCH="squad/state/$CALLSIGN"
            echo "Folding inbox refs for $CALLSIGN into $STATE_BRANCH ..."

            if git ls-remote --exit-code origin "refs/heads/${STATE_BRANCH}" >/dev/null 2>&1; then
              git fetch origin "$STATE_BRANCH"
              git checkout -B "$STATE_BRANCH" "origin/$STATE_BRANCH"
            else
              git checkout --orphan "$STATE_BRANCH"
              git rm -rf . >/dev/null 2>&1 || true
              git commit --allow-empty -m "Initialize Squad state branch for $CALLSIGN"
            fi

            HISTORY_FILE=".squad/publish-history.json"
            FOLDED_REFS=""
            if [ ! -s "$HISTORY_FILE" ] || ! jq -e 'type == "array"' "$HISTORY_FILE" >/dev/null 2>&1; then
              if [ -e "$HISTORY_FILE" ]; then
                echo "::warning::$HISTORY_FILE is missing, empty, or non-array JSON — resetting to []."
                printf '%s\n' '[]' > "$HISTORY_FILE"
              fi
            else
              FOLDED_REFS=$(jq -r '.[].foldedRefs[].ref // empty' "$HISTORY_FILE" 2>/dev/null || true)
            fi

            INBOX_REFS=$(git ls-remote --heads origin "refs/heads/squad/inbox/${CALLSIGN}/*" | awk '{print $2}')
            SORT_LIST=()
            while IFS= read -r REF; do
              [ -z "$REF" ] && continue
              if [ -n "$FOLDED_REFS" ] && printf '%s\n' "$FOLDED_REFS" | grep -qxF "$REF"; then
                echo "  Skipping $REF (already recorded in publish-history.json)"
                continue
              fi
              TS=$(echo "$REF" | grep -oP '\d{8}-\d{6}' || echo "00000000-000000")
              SESSION=$(echo "$REF" | sed 's|.*/||')
              SORT_LIST+=("${TS}"$'\t'"${SESSION}"$'\t'"${REF}")
            done <<< "$INBOX_REFS"

            if [ ${#SORT_LIST[@]} -eq 0 ]; then
              echo "No unfolded refs for $CALLSIGN — nothing to do."
              continue
            fi

            SORTED_REFS=$(printf '%s\n' "${SORT_LIST[@]}" | sort | cut -f3)
            FOLDED_ENTRIES="[]"

            while IFS= read -r REF; do
              [ -z "$REF" ] && continue
              SHORT_REF="${REF#refs/heads/}"
              echo "  Folding $REF ..."

              REF_SHA=$(git ls-remote origin "$REF" | awk '{print $1}')
              if [ -z "$REF_SHA" ]; then
                echo "  WARNING: Cannot resolve $REF — skipping."
                continue
              fi

              git fetch origin "+${REF}:refs/fold-tmp/inbox" 2>/dev/null

              METADATA_SHA=$(git ls-tree refs/fold-tmp/inbox .squad/publish-metadata.json 2>/dev/null | awk '{print $3}')
              PUB_AT="1970-01-01T00:00:00Z"
              DEV_ALIAS="unknown"
              if [ -n "$METADATA_SHA" ]; then
                META_JSON=$(git cat-file blob "$METADATA_SHA" 2>/dev/null || echo '{}')
                PUB_AT=$(echo "$META_JSON" | jq -r '.publishedAt // "1970-01-01T00:00:00Z"')
                DEV_ALIAS=$(echo "$META_JSON" | jq -r '.developerAlias // "unknown"')
              else
                echo "  WARNING: Missing .squad/publish-metadata.json on $REF — using defaults."
              fi

              INBOX_SQUAD_TREE=$(git ls-tree refs/fold-tmp/inbox .squad 2>/dev/null | awk '{print $3}')
              if [ -z "$INBOX_SQUAD_TREE" ]; then
                echo "  WARNING: No .squad/ subtree in $REF — skipping."
                git update-ref -d refs/fold-tmp/inbox 2>/dev/null || true
                continue
              fi

              git rm -r --cached .squad/ 2>/dev/null || true
              git read-tree --prefix=.squad/ -u "$INBOX_SQUAD_TREE"
              git add .squad/

              GIT_AUTHOR_DATE="$PUB_AT" GIT_COMMITTER_DATE="$PUB_AT" \
                git commit \
                  --author="Squad Fold Pipeline <squad-fold@noreply>" \
                  -m "fold: $SHORT_REF (alias=$DEV_ALIAS publishedAt=$PUB_AT)"

              ENTRY=$(jq -n \
                --arg ref "$REF" \
                --arg sha "$REF_SHA" \
                --arg alias "$DEV_ALIAS" \
                --arg pubAt "$PUB_AT" \
                '{ref: $ref, sha: $sha, developerAlias: $alias, publishedAt: $pubAt}')
              FOLDED_ENTRIES=$(echo "$FOLDED_ENTRIES" | jq --argjson e "$ENTRY" '. + [$e]')

              git update-ref -d refs/fold-tmp/inbox 2>/dev/null || true
            done <<< "$SORTED_REFS"

            FINAL_SHA=$(git rev-parse HEAD 2>/dev/null || echo "")
            EXISTING="[]"
            if [ -s "$HISTORY_FILE" ] && jq -e 'type == "array"' "$HISTORY_FILE" >/dev/null 2>&1; then
              EXISTING=$(cat "$HISTORY_FILE")
            fi

            FOLD_TS=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            NEW_RECORD=$(jq -n \
              --arg ts "$FOLD_TS" \
              --arg sha "$FINAL_SHA" \
              --argjson entries "$FOLDED_ENTRIES" \
              '{foldTimestamp: $ts, foldedRefs: $entries, foldCommitSha: $sha}')

            UPDATED_HISTORY=$(printf '%s\n' "$EXISTING" | jq --argjson r "$NEW_RECORD" '. + [$r]')
            if [ -z "$UPDATED_HISTORY" ] || ! printf '%s\n' "$UPDATED_HISTORY" | jq -e 'type == "array"' >/dev/null 2>&1; then
              echo "::error::Failed to produce valid publish-history.json — aborting to prevent data loss."
              exit 1
            fi
            mkdir -p "$(dirname "$HISTORY_FILE")"
            printf '%s\n' "$UPDATED_HISTORY" > "$HISTORY_FILE"
            git add "$HISTORY_FILE"
            git commit -m "fold: update publish-history.json (foldTimestamp=$FOLD_TS)"

            git push origin HEAD:refs/heads/${STATE_BRANCH} --force-with-lease

            if [ "${DELETE_FOLDED_REFS:-false}" = "true" ]; then
              while IFS= read -r REF; do
                [ -z "$REF" ] && continue
                echo "  Deleting folded Squad inbox ref: $REF"
                git push origin --delete "${REF#refs/heads/}" || echo "  WARNING: Failed to delete $REF — continuing."
              done <<< "$SORTED_REFS"
            fi
          done