# Squad config pipeline — GitHub variant
# Opens a review pull request for durable squad-config changes published to a config-inbox branch.
#
# Trigger: push to any branch under squad/config-inbox/** (the durable publish lane, piece 53 §A).
# For each config-inbox ref this pipeline assembles a candidate durable tree and opens a PR into
# squad/config/<callsign>. It NEVER force-pushes the durable branch — the human approval + merge of
# that PR is the ONLY gate that advances squad/config/<callsign> (symmetric with the ephemeral fold,
# which differs only in that it force-pushes instead of opening a PR).
#
# ── Required reviewer (CODEOWNERS) ───────────────────────────────────────────────────────────────
# Route the durable constitution to a required reviewer by adding a CODEOWNERS entry on the host
# repository (committed on the default branch). Because the durable tree lives under the team root's
# `.squad/**`, use:
#
#     # .github/CODEOWNERS
#     /.squad/                 @your-org/squad-maintainers
#     # or, for a subfolder (monorepo) host scoped to one callsign:
#     /<callsign>/.squad/      @your-org/squad-maintainers
#
# Then enable "Require review from Code Owners" in the branch protection rule for
# squad/config/<callsign> so the auto-opened PR cannot merge without that reviewer.
#
# NOTE (branch creation): the protection rule for squad/config/<callsign> must still allow this
# pipeline to CREATE the branch the first time — the genesis step below pushes an empty orphan when
# squad/config/<callsign> is absent. If your ruleset blocks branch *creation* on the
# squad/config/* pattern, pre-create an empty squad/config/<callsign> branch once by hand (or scope
# the creation restriction to exclude it) so the first reviewed change is not blocked.
#
# ── GITHUB_TOKEN downstream-CI caveat ────────────────────────────────────────────────────────────
# A pull request opened by the default GITHUB_TOKEN does NOT trigger downstream `on: pull_request`
# workflows. If the config lane needs CI to run on the candidate PR, open the PR with a PAT or a
# GitHub App installation token instead of GITHUB_TOKEN (set it as a secret and reference it below).

on:
  workflow_dispatch:
  push:
    branches:
      - 'squad/config-inbox/**'

permissions:
  contents: write
  pull-requests: write

# Serialize config-PR runs so two config-inbox pushes never race the candidate push / PR open for
# the same callsign. Never cancel an in-flight run mid-push — queue instead.
concurrency:
  group: config-squad-pr
  cancel-in-progress: false

jobs:
  open-config-pr:
    runs-on: ubuntu-latest
    steps:
      # This pipeline is the only automation that opens PRs into squad/config/<callsign>.
      # It never force-pushes that branch; the human approval on the PR is the sole gate.

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.email "squad-config@noreply"
          git config user.name "Squad Config Pipeline"

      - name: Assemble candidate and open config PRs
        env:
          # GITHUB_TOKEN opens the PR but does NOT trigger downstream pull_request CI (see header).
          # Swap for a PAT/App token secret if the candidate PR must run CI, e.g.:
          #   GH_TOKEN: ${{ secrets.SQUAD_CONFIG_PR_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          callsigns="$(git ls-remote --heads origin 'refs/heads/squad/config-inbox/*' \
            | sed -nE 's#^[0-9a-f]+\srefs/heads/squad/config-inbox/([^/]+)/.*#\1#p' \
            | sort -u)"

          if [ -z "$callsigns" ]; then
            echo "No Squad config-inbox callsigns discovered — nothing to do."
            exit 0
          fi

          for CALLSIGN in $callsigns; do
            if ! [[ "$CALLSIGN" =~ ^[a-z][a-z0-9-]{1,38}$ ]]; then
              echo "WARNING: Skipping invalid callsign '$CALLSIGN'."
              continue
            fi

            CONFIG_BRANCH="squad/config/$CALLSIGN"
            echo "Processing config-inbox refs for $CALLSIGN into $CONFIG_BRANCH ..."

            # Ensure the durable branch exists. Genesis-seed an EMPTY orphan when absent (piece 52 §B)
            # so the very first constitution still arrives through the reviewed PR, not a raw push.
            if ! git ls-remote --exit-code origin "refs/heads/${CONFIG_BRANCH}" >/dev/null 2>&1; then
              echo "  $CONFIG_BRANCH absent — genesis-seeding an empty orphan."
              git checkout --detach >/dev/null 2>&1 || true
              git branch -D "$CONFIG_BRANCH" >/dev/null 2>&1 || true
              git checkout --orphan "$CONFIG_BRANCH"
              git rm -rf . >/dev/null 2>&1 || true
              git commit --allow-empty -m "Initialize Squad config branch for $CALLSIGN"
              git push origin "HEAD:refs/heads/${CONFIG_BRANCH}"
            fi

            INBOX_REFS=$(git ls-remote --heads origin "refs/heads/squad/config-inbox/${CALLSIGN}/*" | awk '{print $2}' | tr -d '\r')

            while IFS= read -r REF; do
              [ -z "$REF" ] && continue
              SHORT_REF="${REF#refs/heads/}"
              echo "  Assembling candidate from $SHORT_REF ..."

              git fetch origin "+${REF}:refs/config-tmp/inbox" 2>/dev/null

              # Read the publisher metadata for the PR body (dev-alias + publishedAt).
              METADATA_SHA=$(git ls-tree refs/config-tmp/inbox .squad/publish-metadata.json 2>/dev/null | awk '{print $3}')
              PUB_AT="1970-01-01T00:00:00Z"
              DEV_ALIAS="unknown"
              if [ -n "$METADATA_SHA" ]; then
                META_JSON=$(git cat-file blob "$METADATA_SHA" 2>/dev/null || echo '{}')
                PUB_AT=$(echo "$META_JSON" | jq -r '.publishedAt // "1970-01-01T00:00:00Z"')
                DEV_ALIAS=$(echo "$META_JSON" | jq -r '.inboxHandle // "unknown"')
              else
                echo "  WARNING: Missing .squad/publish-metadata.json on $SHORT_REF — using defaults."
              fi

              # publishedAt is attacker-influenced (read straight from the inbox payload). A malformed
              # value would make the `GIT_*_DATE` commit below fail under `set -e` and stall the lane,
              # so normalize any non-ISO-8601 value back to the epoch default before it is used.
              if ! printf '%s' "$PUB_AT" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$'; then
                echo "  WARNING: publishedAt '$PUB_AT' is not ISO-8601 — using epoch default."
                PUB_AT="1970-01-01T00:00:00Z"
              fi

              INBOX_SQUAD_TREE=$(git ls-tree refs/config-tmp/inbox .squad 2>/dev/null | awk '{print $3}')
              if [ -z "$INBOX_SQUAD_TREE" ]; then
                echo "  WARNING: No .squad/ subtree in $SHORT_REF — deleting empty ref and skipping."
                git push origin --delete "$SHORT_REF" || echo "  WARNING: Failed to delete $SHORT_REF."
                git update-ref -d refs/config-tmp/inbox 2>/dev/null || true
                continue
              fi

              # Base the candidate on the current durable branch tip.
              git fetch origin "$CONFIG_BRANCH"
              # Name the candidate from the inbox ref's own unique id (<ts>-<seq>-<sessionId>), NOT a
              # fresh 1s-resolution timestamp: two config-inbox refs for the same callsign handled
              # inside one wall-clock second would otherwise collide onto a single candidate branch,
              # the second push would non-fast-forward reject, and `set -e` would stall the whole lane.
              REF_ID="${SHORT_REF##*/}"
              CANDIDATE_BRANCH="squad/config-candidate/${CALLSIGN}/${REF_ID}"

              # Dedup without a ledger. The candidate name is deterministic per inbox ref, so if an
              # earlier run already opened this PR but failed to delete the inbox ref, the candidate
              # branch already exists on the remote. Re-attempt the ref cleanup and skip, rather than
              # opening a duplicate review PR on every trigger until the original PR merges.
              if git ls-remote --exit-code --heads origin "refs/heads/${CANDIDATE_BRANCH}" >/dev/null 2>&1; then
                echo "  Candidate $CANDIDATE_BRANCH already exists — $SHORT_REF already processed; cleaning inbox ref, no duplicate PR."
                git push origin --delete "$SHORT_REF" || echo "  WARNING: Failed to delete $SHORT_REF."
                git update-ref -d refs/config-tmp/inbox 2>/dev/null || true
                continue
              fi
              git checkout -B "$CANDIDATE_BRANCH" "origin/${CONFIG_BRANCH}"

              # CLEAN-REPLACE the durable subtree so file DELETIONS in the snapshot are honored.
              # `git archive | tar -x` only adds/overwrites — a publish whose sole change is removing
              # a durable file (e.g. retiring an agent charter) would otherwise diff empty, silently
              # drop the deletion, AND destroy the inbox ref on the "no change" path. Remove the
              # tracked durable tree first, then extract the full snapshot; the publish payload is the
              # complete CONFIG_ALLOWLIST tree, so a clean replace represents adds, edits and deletes.
              git rm -r --quiet --ignore-unmatch .squad >/dev/null 2>&1 || true
              # Exclude publish-metadata.json (publisher scratch, mirrors the fold's publish-history
              # exclusion) so only the constitution lands on config.
              git archive refs/config-tmp/inbox .squad \
                | tar -x --exclude='.squad/publish-metadata.json'
              git add -A .squad/

              CHANGED_PATHS=$(git diff --cached --name-only | tr '\n' ' ')
              # Defense-in-depth: the publish client already filters to CONFIG_ALLOWLIST, but re-check
              # server-side and SURFACE — never silently strip, which could drop a valid change if the
              # allowlist evolves — any changed .squad path outside the durable allowlist so the human
              # reviewer (the gate) sees it. Mirrors CONFIG_ALLOWLIST in
              # packages/squad-cli/src/cli/commands/sync.ts; keep the two in sync.
              UNEXPECTED_PATHS=""
              while IFS= read -r CP; do
                [ -z "$CP" ] && continue
                case "$CP" in
                  .squad/team.md|.squad/roster.md|.squad/routing.md|.squad/charter.md|.squad/scribe-charter.md|.squad/fact-checker-charter.md|.squad/config.json|.squad/casting-policy.json|.squad/ceremonies.md|.squad/issue-lifecycle.md|.squad/mcp-config.md|.squad/multi-agent-format.md|.squad/copilot-instructions.md|.squad/constraint-tracking.md|.squad/skill.md|.squad/plugin-marketplace.md) ;;
                  .squad/templates/*|.squad/skills/*|.squad/files/triage-flow/*) ;;
                  .squad/agents/*/charter.md) ;;
                  *) UNEXPECTED_PATHS="${UNEXPECTED_PATHS}${CP} " ;;
                esac
              done < <(git diff --cached --name-only)
              if git diff --cached --quiet; then
                echo "  $SHORT_REF introduces no durable change — deleting ref, no PR."
                git push origin --delete "$SHORT_REF" || echo "  WARNING: Failed to delete $SHORT_REF."
                git update-ref -d refs/config-tmp/inbox 2>/dev/null || true
                continue
              fi

              GIT_AUTHOR_DATE="$PUB_AT" GIT_COMMITTER_DATE="$PUB_AT" \
                git commit \
                  --author="Squad Config Pipeline <squad-config@noreply>" \
                  -m "config: $DEV_ALIAS durable change (publishedAt=$PUB_AT)"

              git push origin "HEAD:refs/heads/${CANDIDATE_BRANCH}"

              PR_BODY=$(printf 'Automated durable-config review PR (piece 53).\n\n- Developer: %s\n- Published at: %s\n- Source config-inbox ref: %s\n- Changed durable paths: %s\n\nApprove + merge to advance %s. This PR is the only gate on the durable constitution.' \
                "$DEV_ALIAS" "$PUB_AT" "$SHORT_REF" "$CHANGED_PATHS" "$CONFIG_BRANCH")

              # Surface any non-durable paths to the reviewer instead of silently accepting them.
              if [ -n "$UNEXPECTED_PATHS" ]; then
                echo "::warning::Non-durable paths present in config payload for $SHORT_REF: $UNEXPECTED_PATHS"
                PR_BODY="${PR_BODY}"$'\n\n'"⚠️ REVIEW CAREFULLY: these changed paths are OUTSIDE the durable CONFIG_ALLOWLIST and should not normally arrive on this lane: ${UNEXPECTED_PATHS}"
              fi

              # Open the PR BEFORE deleting the inbox ref, so a failure leaves the source recoverable.
              if gh pr create \
                --base "$CONFIG_BRANCH" \
                --head "$CANDIDATE_BRANCH" \
                --title "config($CALLSIGN): durable change from $DEV_ALIAS" \
                --body "$PR_BODY"; then
                echo "  PR opened for $CANDIDATE_BRANCH → $CONFIG_BRANCH."
                git push origin --delete "$SHORT_REF" || echo "  WARNING: Failed to delete $SHORT_REF — continuing."
              else
                echo "::error::Failed to open PR for $CANDIDATE_BRANCH — leaving $SHORT_REF in place for retry."
              fi

              git update-ref -d refs/config-tmp/inbox 2>/dev/null || true
            done <<< "$INBOX_REFS"
          done
