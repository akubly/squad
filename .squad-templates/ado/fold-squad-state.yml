# fold-squad-state.yml
#
# Squad state fold pipeline.
#
# INVARIANT: This pipeline is the SOLE writer to refs/heads/squad-state. No other
# pipeline, script, or workflow may push to squad-state. Direct developer pushes
# must be blocked by branch policy. Exceptions require a decision record in
# .squad/decisions/inbox/ and explicit user adjudication.
#
# Triggered by pushes to squad/inbox/* branches (inbox publish events).
# Folds inbox branches into squad-state in deterministic order and updates
# .squad/publish-history.json with fold provenance.

trigger:
  batch: true          # serialize fold runs — at most one active, then one queued
  branches:
    include:
      - squad/inbox/**

# No pr: trigger — fold is a push-only, state-serialization operation.

pool:
  vmImage: ubuntu-latest

variables:
  nodeVersion: '20'
  # Set pruneAfterFold to true to delete inbox refs after a successful fold.
  # Default is false — refs are retained for auditability.
  pruneAfterFold: false

steps:
  - checkout: self
    fetchDepth: 0
    persistCredentials: true
    displayName: 'Checkout docs repo (TEAM_ROOT) with full history'

  - script: |
      git config user.email "squad-fold-pipeline@squad.local"
      git config user.name "Squad Fold Pipeline"
    displayName: 'Configure git identity for fold commits'

  - script: |
      # Fetch all inbox refs and squad-state
      git fetch origin '+refs/heads/squad/inbox/*:refs/remotes/origin/squad/inbox/*'
      git fetch origin '+refs/heads/squad-state:refs/remotes/origin/squad-state' 2>/dev/null || true
    displayName: 'Fetch inbox refs'

  - script: |
      #!/usr/bin/env bash
      set -euo pipefail

      # -----------------------------------------------------------------------
      # Inline fold logic — pipeline-resident operation per piece 28 + 30 spec.
      # The fold pipeline does NOT invoke any squad CLI subcommand. All fold
      # steps use pure git plumbing (git checkout, git commit, jq).
      #
      # Step 1: Switch to squad-state (initialize as orphan if first fold ever).
      # Step 2: Enumerate squad/inbox/<alias>/<session> refs not yet recorded in
      #         .squad/publish-history.json.
      # Step 3: Sort by publishedAt (from publish-metadata.json), then ref name.
      # Step 4: For each ref: merge .squad/ tree, append to publish-history.json,
      #         commit to squad-state.
      # -----------------------------------------------------------------------

      HISTORY_FILE=".squad/publish-history.json"

      # jq is pre-installed on ubuntu-latest; fail fast if missing.
      if ! command -v jq &>/dev/null; then
        echo "::error::jq is required but not found. Use ubuntu-latest or install jq."
        exit 1
      fi

      # Step 1: Switch to squad-state
      if git ls-remote --exit-code origin refs/heads/squad-state &>/dev/null; then
        git fetch origin squad-state:refs/heads/squad-state 2>/dev/null || true
        git checkout squad-state
      else
        # First fold ever — initialize squad-state as an orphan branch
        echo "squad-state does not exist on origin — initializing."
        git checkout --orphan squad-state
        git rm -rf . 2>/dev/null || true
        mkdir -p .squad
        echo '[]' > "$HISTORY_FILE"
        git add "$HISTORY_FILE"
        git commit -m "chore: initialize squad-state branch"
      fi

      # Step 2: Load the set of already-folded inbox ref names from publish-history.json.
      # Uses ref-name membership (not timestamp comparison) — immune to clock skew and
      # same-second tie collisions that cause silent data loss with a scalar timestamp cutoff.
      # Edge cases:
      #   - File absent (first fold ever): treated as empty set; fold all refs.
      #   - File present but empty ([]):  treated as empty set; fold all refs.
      #   - File present but malformed:   abort with error to prevent data loss.
      FOLDED_REFS=""
      if [ -f "$HISTORY_FILE" ]; then
        if ! jq empty "$HISTORY_FILE" 2>/dev/null; then
          echo "::error::$HISTORY_FILE contains malformed JSON — aborting fold to prevent data loss."
          exit 1
        fi
        FOLDED_REFS=`jq -r '.[].inboxRef // empty' "$HISTORY_FILE" 2>/dev/null || true`
      fi
      if [ -n "$FOLDED_REFS" ]; then
        FOLDED_COUNT=`printf '%s\n' "$FOLDED_REFS" | grep -c .`
      else
        FOLDED_COUNT=0
      fi
      echo "Already-folded refs in publish-history.json: ${FOLDED_COUNT}"

      # Collect all remote inbox refs
      mapfile -t ALL_REFS < <(
        git for-each-ref --format='%(refname:short)' 'refs/remotes/origin/squad/inbox/'
      )

      if [ "${#ALL_REFS[@]}" -eq 0 ]; then
        echo "No inbox refs found. Nothing to fold."
        exit 0
      fi
      echo "Found ${#ALL_REFS[@]} inbox ref(s)."

      # Step 3: Build sort list — skip any ref already recorded in publish-history.json.
      # Sort key: publishedAt (primary), developerAlias (tie-breaker per spec §3),
      # ref name (tertiary, for full stability).
      # Refs missing publish-metadata.json are skipped with a warning (skip-and-continue
      # chosen over abort so one malformed branch cannot block folding of valid refs).
      SORT_LIST=()
      for REF in "${ALL_REFS[@]}"; do
        # Membership guard: skip if this inbox ref name already appears in publish-history.json.
        # This is the idempotency key — re-running against an already-folded ref is a no-op.
        if [ -n "$FOLDED_REFS" ] && printf '%s\n' "$FOLDED_REFS" | grep -qxF "$REF"; then
          echo "  Skipping $REF (already recorded in publish-history.json)"
          continue
        fi

        META_JSON=`git show "${REF}:.squad/publish-metadata.json" 2>/dev/null || true`
        if [ -z "$META_JSON" ] || [ "$META_JSON" = '{}' ]; then
          echo "  Warning: $REF has no publish-metadata.json — skipping (older provenance or malformed branch)."
          continue
        fi

        REF_PUB_AT=`echo "$META_JSON" | jq -r '.publishedAt // empty' 2>/dev/null || true`
        ALIAS=`echo "$META_JSON" | jq -r '.developerAlias // empty' 2>/dev/null || true`

        # Sort key: publishedAt primary, developerAlias secondary, ref name tertiary (for stability)
        SORT_KEY="${REF_PUB_AT:-}"$'\t'"${ALIAS:-}"$'\t'"$REF"
        SORT_LIST+=("$SORT_KEY")
      done

      if [ "${#SORT_LIST[@]}" -eq 0 ]; then
        echo "No new inbox refs to fold (all already recorded)."
        exit 0
      fi

      # Sort by key, extract ref names in deterministic order
      mapfile -t SORTED_REFS < <(printf '%s\n' "${SORT_LIST[@]}" | sort | cut -f3)

      echo "Folding ${#SORTED_REFS[@]} ref(s) in order:"
      for R in "${SORTED_REFS[@]}"; do echo "  $R"; done

      # Ensure .squad/ directory exists on squad-state
      mkdir -p .squad
      if [ ! -f "$HISTORY_FILE" ]; then
        echo '[]' > "$HISTORY_FILE"
      fi

      # Step 4: Fold each ref in sorted order
      for REF in "${SORTED_REFS[@]}"; do
        echo ""
        echo "--- Folding: $REF ---"

        META_JSON=`git show "${REF}:.squad/publish-metadata.json" 2>/dev/null || echo '{}'`
        ALIAS=`echo "$META_JSON" | jq -r '.developerAlias // "unknown"'`
        PUB_AT=`echo "$META_JSON" | jq -r '.publishedAt // empty'`
        SESSION=`echo "$META_JSON" | jq -r '.sessionId // "unknown"'`
        COMMIT=`git rev-parse "$REF"`

        # Save current publish-history.json before tree merge
        SAVED_HISTORY=`cat "$HISTORY_FILE"`

        # Merge .squad/ tree from inbox ref into working tree
        git checkout "$REF" -- .squad/ 2>/dev/null || true

        # Restore publish-history.json (inbox ref must not overwrite fold history)
        echo "$SAVED_HISTORY" > "$HISTORY_FILE"

        # Append fold entry to publish-history.json
        FOLDED_AT=`date -u +%Y-%m-%dT%H:%M:%SZ`
        ENTRY=`jq -n \
          --arg alias "$ALIAS" \
          --arg publishedAt "$PUB_AT" \
          --arg sessionId "$SESSION" \
          --arg inboxRef "$REF" \
          --arg foldCommit "$COMMIT" \
          --arg foldedAt "$FOLDED_AT" \
          '{developerAlias:$alias,publishedAt:$publishedAt,sessionId:$sessionId,inboxRef:$inboxRef,foldCommit:$foldCommit,foldedAt:$foldedAt}'`
        echo "$SAVED_HISTORY" | jq ". + [$ENTRY]" > "$HISTORY_FILE"

        git add .squad/
        git commit -m "fold: $ALIAS / $SESSION (${PUB_AT:-$REF})"
        echo "  Committed fold for $ALIAS (session=$SESSION)"
      done
    displayName: 'Fold inbox branches into squad-state (inline git plumbing)'

  - script: |
      # Fast-forward squad-state to the new fold tip.
      # SYSTEM_ACCESSTOKEN env var is scoped to this step only.
      # Note: persistCredentials (from checkout) makes the git credential helper
      # available job-wide — this is required for git push to succeed.
      git push --ff-only origin HEAD:squad-state
    displayName: 'Fast-forward squad-state'
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)

  - script: |
      if [ "$(pruneAfterFold)" = "true" ]; then
        echo "Pruning merged inbox refs ..."
        while IFS= read -r REF; do
          REMOTE_REF="${REF#origin/}"
          git push origin --delete "$REMOTE_REF" 2>/dev/null \
            || echo "  Could not delete $REMOTE_REF (may already be deleted — continuing)"
        done < <(git for-each-ref --format='%(refname:short)' 'refs/remotes/origin/squad/inbox/')
        echo "Prune complete."
      else
        echo "Prune disabled (pruneAfterFold=false) — inbox refs retained for auditability."
      fi
    displayName: 'Prune merged inbox refs (optional)'

  - script: |
      echo "Fold complete."
      HISTORY_FILE=".squad/publish-history.json"
      if [ -f "$HISTORY_FILE" ]; then
        COUNT=`jq 'length' "$HISTORY_FILE"`
        echo "Publish history: $COUNT total entries."
        echo "Last 5 entries:"
        jq '.[-5:]' "$HISTORY_FILE"
      else
        echo "(no history file — fold produced no commits)"
      fi
    displayName: 'Report fold results'
